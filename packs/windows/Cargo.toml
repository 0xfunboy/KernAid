[package]
name = "kernaid-windows-pack"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "kernaid-windows-diagnose"
path = "src/bin/diagnose.rs"
