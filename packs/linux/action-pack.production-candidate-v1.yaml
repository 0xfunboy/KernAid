apiVersion: kernaid.dev/v1alpha1
kind: ActionPack
metadata:
  name: linux-fstab-production-candidate
  version: 0.2.0
spec:
  productionCandidateOnly: true
  enabledByDefault: false
  platforms: [linux-rescue]
  actions:
    - id: linux.fstab.disable-missing-uuid.v1
      productionCandidateOnly: true
      enabledByDefault: false
      risk: R2
      reversible: true
      requiresBackup: true
      supportedFilesystems: [ext4]
      backupPolicy: rescue.boot-vault.byte-exact-before-write.v1
      backupReservationPolicy: rescue.boot-vault.durable-reservation-before-approval.v1
      backupPhysicalParent: distinct
      timeoutMilliseconds: 120000
      cancellationPolicy: rescue.transaction.safe-boundaries-auto-restore.v1
      idempotencyPolicy: rescue.fstab.disable-missing-uuid.converge-once.v1
      redactionPolicy: rescue.transaction.opaque-identifiers-and-hashes-only.v1
      handler: kernaid-action-linux-rescue
      inputSchema: schemas/linux.fstab.disable-missing-uuid.v1.json
      preflight: linux.fstab.preflight
      validate: linux.boot.validate-fstab
      rollback: linux.fstab.restore
