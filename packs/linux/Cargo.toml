[package]
name="kernaid-linux-pack"
version.workspace=true
edition.workspace=true
[features]
default=[]
fixture-snapshot-cli = []
fixture-repair-lab=["dep:sha2"]
[lints]
workspace=true
[dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
kernaid-evidence = { path = "../../crates/evidence" }
[dev-dependencies]
tempfile = "3.27"
[[bin]]
name="kernaid-linux-inventory"
path="src/main.rs"
[[bin]]
name="kernaid-linux-diagnose"
path="src/bin/diagnose.rs"
[[bin]]
name="kernaid-linux-snapshot-fixture"
path="src/bin/snapshot_fixture.rs"
required-features=["fixture-snapshot-cli"]
