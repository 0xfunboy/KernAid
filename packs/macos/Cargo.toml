[package]
name = "kernaid-macos-pack"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"

[dependencies]
plist = "1.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "kernaid-macos-diagnose"
path = "src/bin/diagnose.rs"
