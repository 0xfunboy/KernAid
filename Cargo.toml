[workspace]
resolver = "2"
members = [
  "crates/core", "crates/broker", "crates/evidence", "crates/policy",
  "crates/protocol", "crates/storage", "crates/redaction", "crates/device-identity",
  "crates/native-secrets", "crates/rescue-secrets", "crates/report-schema",
  "crates/rescue-openai-provider", "crates/rescue-openai-executor",
  "crates/rescue-codex-bridge",
  "packs/linux", "packs/macos", "packs/windows", "apps/desk/src-tauri",
  "apps/desk/src-tauri-rescue"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
