[package]
name = "kernaid-native-secrets"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
kernaid-device-identity = { path = "../device-identity" }
kernaid-storage = { path = "../storage" }
keyring-core = { version = "1.0", default-features = false }
zeroize = "1.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", default-features = false, features = ["crypto-rust"] }

[lints]
workspace = true
