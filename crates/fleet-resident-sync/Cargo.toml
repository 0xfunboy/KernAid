[package]
name = "kernaid-fleet-resident-sync"
version.workspace = true
edition.workspace = true

[features]
default = []
linux-resident = [
  "dep:fs2",
  "dep:kernaid-native-secrets",
  "dep:rand_core",
  "dep:reqwest",
  "dep:rustix",
  "dep:rustls",
  "dep:zeroize",
]

[[bin]]
name = "kernaid-fleet-resident-sync"
path = "src/main.rs"
required-features = ["linux-resident"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = { version = "0.4.3", optional = true }
kernaid-device-identity = { path = "../device-identity" }
kernaid-fleet-client = { path = "../fleet-client" }
kernaid-fleet-coordinator = { path = "../fleet-coordinator" }
kernaid-fleet-policy = { path = "../fleet-policy" }
kernaid-native-secrets = { path = "../native-secrets", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"], optional = true }
rustix = { version = "1.1.4", features = ["fs", "process"], optional = true }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1.8", optional = true }

[dev-dependencies]
ed25519-dalek = "2.2"
tempfile = "3"

[lints]
workspace = true
