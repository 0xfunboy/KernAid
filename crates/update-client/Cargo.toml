[package]
name = "kernaid-update-client"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
