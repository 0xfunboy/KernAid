[package]
name = "kernaid-rescue-openai-executor"
version.workspace = true
edition.workspace = true

[dependencies]
httparse = "1.10.1"
kernaid-protocol = { path = "../protocol" }
kernaid-rescue-openai-provider = { path = "../rescue-openai-provider" }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.4"
zeroize = "1.9"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process"] }

[dev-dependencies]
rcgen = { version = "0.14.5", default-features = false, features = ["crypto", "ring"] }

[lints]
workspace = true

[[bin]]
name = "kernaid-rescue-openai-executor"
path = "src/main.rs"
