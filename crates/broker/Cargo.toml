[package]
name = "kernaid-broker"
version.workspace = true
edition.workspace = true
[dependencies]
kernaid-protocol = { path = "../protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
kernaid-device-identity = { path = "../device-identity" }
kernaid-linux-pack = { path = "../../packs/linux" }
kernaid-storage = { path = "../storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
