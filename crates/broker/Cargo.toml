[package]
name = "kernaid-broker"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kernaid-rescue-repaird"
path = "src/bin/kernaid-rescue-repaird.rs"
required-features = ["rescue-fstab-production-candidate"]
[features]
default = []
fixture-repair-lab = [
    "dep:kernaid-core",
    "dep:kernaid-device-identity",
    "dep:kernaid-linux-pack",
    "dep:kernaid-storage",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "kernaid-core/fixture-repair-lab",
    "kernaid-linux-pack/fixture-repair-lab",
]
rescue-fstab-production-candidate = [
    "repair-vault-client",
    "rescue-target-physical-parent",
    "dep:kernaid-core",
    "dep:kernaid-linux-pack",
    "dep:kernaid-linux-systemd",
    "dep:serde",
    "dep:serde_json",
    "kernaid-core/rescue-fstab-production-candidate",
    "kernaid-linux-pack/rescue-fstab-production-candidate",
]
rescue-crypttab-production-candidate = [
    "rescue-fstab-production-candidate",
    "dep:kernaid-core",
    "dep:kernaid-linux-pack",
    "dep:sha2",
    "dep:zeroize",
    "kernaid-core/rescue-crypttab-production-candidate",
    "kernaid-linux-pack/rescue-crypttab-production-candidate",
]
rescue-ext4-fsck-production-candidate = [
    "rescue-fstab-production-candidate",
    "dep:sha2",
    "dep:zeroize",
]
repair-vault-client = [
    "dep:rustix",
    "dep:sha2",
    "dep:zeroize",
    "kernaid-protocol/experimental-repair-store",
]
rescue-target-physical-parent = [
    "dep:rustix",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "kernaid-protocol/experimental-physical-parent-fingerprint",
]
[dependencies]
kernaid-protocol = { path = "../protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
kernaid-core = { path = "../core", optional = true }
kernaid-device-identity = { path = "../device-identity", optional = true }
kernaid-linux-pack = { path = "../../packs/linux", optional = true }
kernaid-linux-systemd = { path = "../linux-systemd", optional = true }
kernaid-storage = { path = "../storage", optional = true }
rustix = { version = "1.1.4", features = ["event", "fs", "mount", "net", "pipe", "rand"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
zeroize = { version = "1.8", optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
kernaid-evidence = { path = "../evidence" }
sha2 = "0.10"
zeroize = "1.8"
[lints]
workspace = true
