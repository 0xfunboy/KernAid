[package]
name = "kernaid-broker"
version.workspace = true
edition.workspace = true
[features]
default = []
fixture-repair-lab = [
    "dep:kernaid-core",
    "dep:kernaid-device-identity",
    "dep:kernaid-linux-pack",
    "dep:kernaid-storage",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "kernaid-core/fixture-repair-lab",
    "kernaid-linux-pack/fixture-repair-lab",
]
rescue-fstab-production-candidate = [
    "dep:kernaid-core",
    "dep:kernaid-linux-pack",
    "dep:rustix",
    "dep:serde",
    "dep:serde_json",
    "kernaid-core/rescue-fstab-production-candidate",
    "kernaid-linux-pack/rescue-fstab-production-candidate",
]
[dependencies]
kernaid-protocol = { path = "../protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
kernaid-core = { path = "../core", optional = true }
kernaid-device-identity = { path = "../device-identity", optional = true }
kernaid-linux-pack = { path = "../../packs/linux", optional = true }
kernaid-storage = { path = "../storage", optional = true }
rustix = { version = "1.1.4", features = ["event", "fs", "net"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
kernaid-evidence = { path = "../evidence" }
sha2 = "0.10"
zeroize = "1.8"
[lints]
workspace = true
