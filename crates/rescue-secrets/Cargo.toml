[package]
name = "kernaid-rescue-secrets"
version.workspace = true
edition.workspace = true

[features]
experimental-vault-manager = []
privileged-probe = ["experimental-vault-manager"]

[dependencies]
base64 = "0.22"
kernaid-device-identity = { path = "../device-identity" }
kernaid-storage = { path = "../storage" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "mount", "process"] }

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true

[[bin]]
name = "kernaid-rescue-vault-probe"
path = "src/bin/kernaid-rescue-vault-probe.rs"
required-features = ["privileged-probe"]
