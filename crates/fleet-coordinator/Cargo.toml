[package]
name = "kernaid-fleet-coordinator"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = "2.2"
kernaid-device-identity = { path = "../device-identity" }
kernaid-entitlements = { path = "../entitlements" }
kernaid-fleet-audit = { path = "../fleet-audit" }
kernaid-fleet-client = { path = "../fleet-client" }
kernaid-fleet-policy = { path = "../fleet-policy" }
kernaid-fleet-runtime = { path = "../fleet-runtime" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
tempfile = "3"

[lints]
workspace = true
