[package]
name = "kernaid-fleet-resident-work-orders"
version.workspace = true
edition.workspace = true

[features]
default = []
rescue-fstab-handoff = [
  "dep:kernaid-core",
  "dep:kernaid-linux-pack",
  "kernaid-core/rescue-fstab-production-candidate",
  "kernaid-linux-pack/rescue-fstab-production-candidate",
]
linux-service = [
  "dep:fs2",
  "dep:kernaid-linux-pack",
  "dep:kernaid-native-secrets",
  "dep:rand_core",
  "dep:reqwest",
  "dep:rustix",
  "dep:rustls",
]
windows-service = [
  "dep:fs2",
  "dep:kernaid-native-secrets",
  "dep:kernaid-windows-pack",
  "dep:process-wrap",
  "dep:rand_core",
  "dep:reqwest",
  "dep:rustix",
  "dep:rustls",
  "dep:windows-service",
]

[[bin]]
name = "kernaid-fleet-resident-work-orders"
path = "src/main.rs"
required-features = ["linux-service"]

[[bin]]
name = "kernaid-fleet-resident-windows"
path = "src/windows_main.rs"
required-features = ["windows-service"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = "2.2"
fs2 = { version = "0.4.3", optional = true }
kernaid-device-identity = { path = "../device-identity" }
kernaid-core = { path = "../core", optional = true }
kernaid-fleet-client = { path = "../fleet-client" }
kernaid-fleet-policy = { path = "../fleet-policy" }
kernaid-fleet-runtime = { path = "../fleet-runtime" }
kernaid-linux-pack = { path = "../../packs/linux", optional = true }
kernaid-native-secrets = { path = "../native-secrets", optional = true }
kernaid-windows-pack = { path = "../../packs/windows", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"], optional = true }
rustix = { version = "1.1.4", features = ["fs", "process"], optional = true }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
atomic-write-file = "0.3.1"
process-wrap = { version = "9.1.0", default-features = false, features = ["std", "job-object"], optional = true }
windows-service = { version = "0.8.1", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
