[package]
name = "kernaid-fleet-resident-work-orders"
version.workspace = true
edition.workspace = true

[features]
default = []
rescue-fstab-handoff = []

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = "2.2"
kernaid-device-identity = { path = "../device-identity" }
kernaid-fleet-client = { path = "../fleet-client" }
kernaid-fleet-policy = { path = "../fleet-policy" }
kernaid-fleet-runtime = { path = "../fleet-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
