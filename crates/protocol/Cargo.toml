[package]
name = "kernaid-protocol"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(target_os = "linux")'.dependencies]
kernaid-device-identity = { path = "../device-identity" }
rustix = { version = "1.1.4", features = ["fs", "net", "pipe"] }

[dev-dependencies]
kernaid-storage = { path = "../storage" }
tempfile = "3.27"

[lints]
workspace = true
