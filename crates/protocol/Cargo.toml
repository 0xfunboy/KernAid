[package]
name = "kernaid-protocol"
version.workspace = true
edition.workspace = true

[features]
default = []
experimental-repair-store = ["dep:sha2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = { version = "0.10.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
kernaid-device-identity = { path = "../device-identity" }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "pipe"] }

[dev-dependencies]
kernaid-storage = { path = "../storage" }
tempfile = "3.27"

[lints]
workspace = true
