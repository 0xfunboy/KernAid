[package]
name = "kernaid-rescue-desk-shell"
version.workspace = true
edition.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
nix = { version = "0.31.3", features = ["socket", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5", features = ["custom-protocol"] }

[lints]
workspace = true
