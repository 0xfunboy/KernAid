[package]
name="kernaid-desk-shell"
version.workspace=true
edition.workspace=true
build="build.rs"
default-run="kernaid-desk-shell"
[features]
default = []
fixture-repair-lab = [
  "kernaid-broker/fixture-repair-lab",
  "dep:kernaid-core",
  "kernaid-linux-pack/fixture-repair-lab",
  "dep:tempfile",
]
[build-dependencies]
tauri-build = { version = "2.2", features = [] }
[dependencies]
tauri = { version = "2.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4.3"
dirs = "6.0.0"
regex = "1.13"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53", features = ["macros", "sync", "time"] }
zeroize = "1.8"
kernaid-broker = { path = "../../../crates/broker" }
kernaid-core = { path = "../../../crates/core", optional = true, features = ["fixture-repair-lab"] }
kernaid-device-identity = { path = "../../../crates/device-identity" }
kernaid-evidence = { path = "../../../crates/evidence" }
kernaid-macos-pack = { path = "../../../packs/macos" }
kernaid-native-secrets = { path = "../../../crates/native-secrets" }
kernaid-protocol = { path = "../../../crates/protocol" }
kernaid-storage = { path = "../../../crates/storage" }
kernaid-windows-pack = { path = "../../../packs/windows" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "9.1.0", default-features = false, features = ["std", "job-object"] }

[target.'cfg(target_os = "linux")'.dependencies]
kernaid-linux-pack = { path = "../../../packs/linux" }
tempfile = { version = "3.27", optional = true }

[dev-dependencies]
tempfile = "3.27"
tauri = { version = "2.5", features = ["test"] }
tokio = { version = "1.53", features = ["macros", "rt"] }
[lints]
workspace=true
