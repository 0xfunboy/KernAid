[package]
name="kernaid-desk-shell"
version.workspace=true
edition.workspace=true
build="build.rs"
[build-dependencies]
tauri-build = { version = "2.2", features = [] }
[dependencies]
tauri = { version = "2.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4.3"
kernaid-broker = { path = "../../../crates/broker" }
kernaid-device-identity = { path = "../../../crates/device-identity" }
kernaid-native-secrets = { path = "../../../crates/native-secrets" }
kernaid-protocol = { path = "../../../crates/protocol" }
kernaid-storage = { path = "../../../crates/storage" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
kernaid-linux-pack = { path = "../../../packs/linux" }
[lints]
workspace=true
