[package]
name = "kernaid-media-creator-windows"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"

[features]
default = []
windows-cli = []

[[bin]]
name = "kernaid-media-creator"
path = "src/main.rs"
required-features = ["windows-cli"]

[dependencies]
kernaid-media-creator-core = { path = "../../crates/media-creator-core" }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_IO",
  "Win32_System_Ioctl",
] }
wmi = { version = "0.18.4", default-features = false }

[lints.clippy]
unwrap_used = "deny"
panic = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
