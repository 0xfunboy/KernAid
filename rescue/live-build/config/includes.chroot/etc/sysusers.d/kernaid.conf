# Do not declare fixed UIDs in 1000..59999 here: live-config's user-setup
# treats any such early account as evidence that a regular user already exists
# and skips creating kernaid:1000.
g kernaid-inspect - -
g kernaid-vault - -
g kernaid-provider-client - -
g kernaid-codex-client - -
u kernaid-rescue-ui - "KernAid Rescue isolated graphical shell" /nonexistent /usr/sbin/nologin
g kernaid-codex 973 -
u kernaid-codex 973:973 "KernAid Rescue Codex executor" /nonexistent /usr/sbin/nologin
u kernaid-openai - "KernAid Rescue OpenAI executor" /nonexistent /usr/sbin/nologin
u kernaid-openai-egress - "KernAid Rescue OpenAI TLS egress proxy" /nonexistent /usr/sbin/nologin
m kernaid-openai kernaid-vault
