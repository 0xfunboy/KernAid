[Unit]
# Diagnosis must remain available when the encrypted Repair Vault is absent or
# still locked. The socket is present at boot; repaird itself becomes usable
# only after its recovery barrier succeeds.
Wants=kernaid-rescue-repaird.socket
After=kernaid-rescue-repaird.socket

[Service]
# Candidate-only primary GID is authenticated by repaird with SO_PEERCRED.
# Keeping this as a supplementary group would make that kernel credential
# check impossible for the DynamicUser HTTP relay.
Group=kernaid-repair-client
