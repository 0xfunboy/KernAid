name: rescue repair forensic replay

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed repair-candidate run containing the forensic ISO
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  backup-tamper:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install focused VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cryptsetup e2fsprogs ovmf qemu-system-x86 \
            squashfs-tools udev util-linux xorriso

      - name: Harden OVMF firmware ancestry
        run: |
          sudo /usr/bin/python3 -I -B - <<'PY'
          import os
          import stat

          flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
          opened = []

          def harden(descriptor):
              before = os.fstat(descriptor)
              if not stat.S_ISDIR(before.st_mode):
                  raise RuntimeError("OVMF ancestry entry is not a directory")
              os.fchown(descriptor, 0, 0)
              os.fchmod(descriptor, stat.S_IMODE(before.st_mode) & ~0o022)
              after = os.fstat(descriptor)
              if (
                  after.st_uid != 0
                  or after.st_gid != 0
                  or stat.S_IMODE(after.st_mode) & 0o022
              ):
                  raise RuntimeError("OVMF ancestry entry is not trusted")

          def child(parent, name, *, required):
              try:
                  descriptor = os.open(name, flags, dir_fd=parent)
              except FileNotFoundError:
                  if required:
                      raise
                  return None
              opened.append(descriptor)
              harden(descriptor)
              return descriptor

          try:
              root = os.open("/", flags)
              opened.append(root)
              harden(root)
              usr = child(root, "usr", required=True)
              share = child(usr, "share", required=True)
              child(share, "OVMF", required=True)
              child(share, "edk2", required=False)
          finally:
              for descriptor in reversed(opened):
                  os.close(descriptor)
          PY

      - name: Download exact failed candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          name: repair-candidate-forensics
          path: forensics

      - name: Verify forensic ISO boundary
        run: |
          iso="$PWD/forensics/KernAid-Rescue-amd64-repair-candidate.iso"
          checksum="$iso.sha256"
          test -f "$iso" && test ! -L "$iso" && test "$(stat -c '%h' "$iso")" = 1
          test -f "$checksum" && test ! -L "$checksum" && test "$(stat -c '%h' "$checksum")" = 1
          test "$(stat -c '%s' "$iso")" -gt 0
          cd "$PWD/forensics"
          sha256sum -c KernAid-Rescue-amd64-repair-candidate.iso.sha256

      - name: Validate focused replay tooling
        run: |
          bash -n tools/build-rescue/qemu-repair-candidate-smoke.sh
          python3 -B -m unittest \
            tools/build-rescue/tests/test_qemu_repair_candidate_smoke.py

      - name: Replay only authenticated backup tamper
        run: |
          KERNAID_QEMU_SMP=4 \
            ./tools/build-rescue/qemu-repair-candidate-smoke.sh \
            uefi backup-tamper \
            "$PWD/forensics/KernAid-Rescue-amd64-repair-candidate.iso"
