name: rescue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rescue/**"
      - "tools/build-rescue/**"
      - "tools/make-device/catalog-entry.py"
      - "tools/make-device/catalog-entry-v2.py"
      - "tools/make-device/catalog_v2.py"
      - "apps/desk/**"
      - "packs/linux/**"
      - "crates/rescue-secrets/**"
      - "crates/storage/**"
      - "crates/device-identity/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - ".github/workflows/rescue.yml"
permissions: {contents: read}
jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.9}
      - uses: actions/setup-node@v4
        with: {node-version: 24.18.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kernaid/desk build
      - name: Install VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cryptsetup e2fsprogs ovmf qemu-system-x86 \
            shellcheck udev util-linux
      - name: Validate Rescue image-layout tooling
        run: |
          python3 -m unittest discover -s tools/build-rescue/tests -p 'test_*.py' -v
          bash -n tools/build-rescue/build.sh \
            tools/build-rescue/qemu-smoke.sh \
            tools/build-rescue/qemu-usb-smoke.sh
          shellcheck tools/build-rescue/build.sh \
            tools/build-rescue/qemu-smoke.sh \
            tools/build-rescue/qemu-usb-smoke.sh
      - name: Build the host-only Rescue vault lifecycle probe
        run: |
          cargo fmt -p kernaid-rescue-secrets -- --check
          cargo build --locked --release -p kernaid-rescue-secrets \
            --features privileged-probe --bin kernaid-rescue-vault-probe
      - name: Build hybrid BIOS and UEFI ISO
        run: |
          docker run --rm --privileged \
            -e KERNAID_DESK_PREBUILT=1 \
            -v "$PWD:/workspace" -w /workspace \
            debian:trixie-slim \
            sh -c 'apt-get update && apt-get install -y live-build ca-certificates python3 && ./tools/build-rescue/build.sh'
      - name: QEMU BIOS smoke test
        run: KERNAID_SMOKE_LOG=rescue-smoke-bios.log ./tools/build-rescue/qemu-smoke.sh bios
      - name: QEMU UEFI smoke test
        run: KERNAID_SMOKE_LOG=rescue-smoke-uefi.log ./tools/build-rescue/qemu-smoke.sh uefi
      - name: QEMU BIOS USB-style two-boot smoke test
        run: |
          log="$PWD/rescue-usb-smoke-bios.log"
          : >"$log"
          chmod 0644 "$log"
          sudo env KERNAID_USB_SMOKE_LOG="$log" \
            "$PWD/tools/build-rescue/qemu-usb-smoke.sh" bios \
            "$PWD/KernAid-Rescue-amd64.iso" \
            "$PWD/target/release/kernaid-rescue-vault-probe"
          test -r "$log"
          test "$(stat -c '%u:%a' "$log")" = "$(id -u):644"
      - name: QEMU UEFI USB-style two-boot smoke test
        run: |
          log="$PWD/rescue-usb-smoke-uefi.log"
          : >"$log"
          chmod 0644 "$log"
          sudo env KERNAID_USB_SMOKE_LOG="$log" \
            "$PWD/tools/build-rescue/qemu-usb-smoke.sh" uefi \
            "$PWD/KernAid-Rescue-amd64.iso" \
            "$PWD/target/release/kernaid-rescue-vault-probe"
          test -r "$log"
          test "$(stat -c '%u:%a' "$log")" = "$(id -u):644"
      - name: Derive catalog entry from the tested ISO and attested QEMU logs
        env:
          KERNAID_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KERNAID_ARTIFACT_VERSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          iso_sha256="$(sha256sum KernAid-Rescue-amd64.iso | awk '{print $1}')"
          /usr/bin/python3 -I ./tools/make-device/catalog-entry.py \
            --iso "$PWD/KernAid-Rescue-amd64.iso" \
            --sha256 "$iso_sha256" \
            --artifact-version "$KERNAID_ARTIFACT_VERSION" \
            --bios-run-id "$GITHUB_RUN_ID" \
            --bios-run-url "$KERNAID_RUN_URL" \
            --bios-log "$PWD/rescue-smoke-bios.log" \
            --uefi-run-id "$GITHUB_RUN_ID" \
            --uefi-run-url "$KERNAID_RUN_URL" \
            --uefi-log "$PWD/rescue-smoke-uefi.log" \
            > KernAid-Rescue-amd64.catalog-entry.json
          /usr/bin/python3 -m json.tool \
            KernAid-Rescue-amd64.catalog-entry.json >/dev/null
      - name: Validate the inactive catalog-v2 evidence contract
        env:
          KERNAID_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KERNAID_ARTIFACT_VERSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          iso_sha256="$(sha256sum KernAid-Rescue-amd64.iso | awk '{print $1}')"
          /usr/bin/python3 -I ./tools/make-device/catalog-entry-v2.py \
            --iso "$PWD/KernAid-Rescue-amd64.iso" \
            --sha256 "$iso_sha256" \
            --layout-manifest "$PWD/rescue/image-layout/device-layout.v1.json" \
            --artifact-version "$KERNAID_ARTIFACT_VERSION" \
            --bios-run-id "$GITHUB_RUN_ID" \
            --bios-run-url "$KERNAID_RUN_URL" \
            --bios-log "$PWD/rescue-usb-smoke-bios.log" \
            --uefi-run-id "$GITHUB_RUN_ID" \
            --uefi-run-url "$KERNAID_RUN_URL" \
            --uefi-log "$PWD/rescue-usb-smoke-uefi.log" \
            > /tmp/kernaid-catalog-entry-v2.preview.json
          /usr/bin/python3 -m json.tool \
            /tmp/kernaid-catalog-entry-v2.preview.json >/dev/null
      - name: Publish smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KernAid-Rescue-smoke-logs
          path: |
            rescue-smoke-*.log
            rescue-usb-smoke-*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Publish checksums and image
        uses: actions/upload-artifact@v4
        with:
          name: KernAid-Rescue-amd64
          path: |
            KernAid-Rescue-amd64.iso
            KernAid-Rescue-amd64.iso.sha256
            KernAid-Rescue-amd64.catalog-entry.json
          if-no-files-found: error
          retention-days: 14
