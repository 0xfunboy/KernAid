          iso_dir="$RUNNER_TEMP/kernaid-vault-lifecycle-bios/image"
          probe_dir="$RUNNER_TEMP/kernaid-vault-lifecycle-bios/probe"
          iso="$iso_dir/KernAid-Rescue-amd64.iso"
          checksum="$iso_dir/KernAid-Rescue-amd64.iso.sha256"
          probe="$probe_dir/kernaid-rescue-vault-probe"
          raw_output="$RUNNER_TEMP/kernaid-vault-lifecycle-bios.raw.log"
          safe_output="$RUNNER_TEMP/kernaid-vault-lifecycle-bios.sanitized.log"

          for input in "$iso" "$checksum" "$probe"; do
            test -f "$input"
            test ! -L "$input"
            test "$(stat -c '%F:%h' -- "$input")" = "regular file:1"
          done
          chmod 0755 -- "$probe"
          test "$(stat -c '%a' -- "$probe")" = 755
          (
            cd "$iso_dir"
            sha256sum --check --strict KernAid-Rescue-amd64.iso.sha256
          )
          install -m 0600 /dev/null "$raw_output"

          set +e
          sudo -n -- "$GITHUB_WORKSPACE/tools/build-rescue/qemu-vault-lifecycle-smoke.sh" \
            bios "$iso" "$probe" >"$raw_output" 2>&1
          harness_status=$?
          set -e

          python3 -I -B - "$raw_output" "$safe_output" bios "$harness_status" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          raw_path = Path(sys.argv[1])
          safe_path = Path(sys.argv[2])
          firmware = sys.argv[3]
          status = int(sys.argv[4])
          expected_uefi_vars = "fresh-per-boot" if firmware == "uefi" else "not-applicable"
          payload = raw_path.read_bytes()
          if (
              not payload
              or len(payload) > 32768
              or not payload.endswith(b"\n")
              or b"\r" in payload
              or b"\0" in payload
          ):
              raise SystemExit("lifecycle output framing was invalid")
          try:
              lines = payload[:-1].decode("ascii").split("\n")
          except UnicodeDecodeError:
              raise SystemExit("lifecycle output was not ASCII") from None

          failure = re.compile(
              r"KERNAID_QEMU_VAULT_LIFECYCLE_FAILURE_V1 "
              r"stage=[a-z0-9-]+ code=[a-z0-9-]+"
          )
          boot = re.compile(
              rf"KERNAID_QEMU_VAULT_LIFECYCLE_BOOT_V1 firmware={firmware} "
              r"boot=([12]) initial_version=[0-9]+ pre_terminal_version=[0-9]+ "
              r"terminal_epoch_version=[0-9]+ terminal=(clean-lock|persistent-fault) "
              r"device_id=KA-[0-9a-f]{24} wrong_key_rejected=true "
              r"rate_limit_waited=true pre_terminal_daemon_stable=true "
              r"pre_terminal_worker_stable=true pre_terminal_cgroup_stable=true "
              r"pre_terminal_caps_stable=true ambient_zero=true "
              r"no_new_privs=true core_limits_zero=true swaps_empty=true "
              r"cgroup_topology_exact=true shell_mount_absent=true "
              r"provider_configured=true production_executor_unit_binds_to_exact=true "
              r"production_executor_status_path=true conditioned_agent_binds_to_runtime=true "
              r"codex_status_path=true "
              r"production_ui_provider_relay_path=true "
              r"signed_report_path=true "
              r"normal_triple_release=true lifecycle_marker_active_before_borrow=true "
              r"hold_killed_vaultd=(true|false) helper_binds_to_terminated=(true|false) "
              r"worker_pdeath_cleanup=(true|false) test_trigger_sockets_gone=(true|false) "
              r"unit_credentials_cleaned=(true|false) persistent_fault_status_only=(true|false) "
              r"lifecycle_marker_persisted=(true|false) provider_network_used=false "
              r"tls_openai_qualified=false residue_absent=true acpi_shutdown=true"
          )
          raw = re.compile(
              rf"KERNAID_QEMU_VAULT_LIFECYCLE_RAW_V1 firmware={firmware} "
              r"media_bytes=32000000000 iso_bytes=[0-9]+ "
              r"prefix_before_sha256=[0-9a-f]{64} prefix_after_sha256=[0-9a-f]{64} "
              r"observe_before_sha256=[0-9a-f]{64} observe_after_sha256=[0-9a-f]{64} "
              r"swap_before_sha256=[0-9a-f]{64} swap_after_sha256=[0-9a-f]{64} "
              r"p3_before_sha256=[0-9a-f]{64} p3_guest_after_sha256=[0-9a-f]{64} "
              r"p3_post_verify_sha256=[0-9a-f]{64} prefix_immutable=true "
              r"observe_immutable=true swap_immutable=true p3_expected_rw=true"
          )
          attestation = re.compile(
              rf"KERNAID_QEMU_VAULT_LIFECYCLE_ATTESTATION_V1 firmware={firmware} "
              r"boot_count=2 same_usb=true device_id=KA-[0-9a-f]{24} "
              r"device_id_stable=true identity_public_key_stable=true "
              r"guest_device_id_derived=true host_postverify=true acpi_shutdowns_clean=true "
              r"luks_profile_valid=true mutation_versions_exact_plus_two=true "
              r"wrong_key_rejected=true rate_limit_waited=true "
              r"boot1_clean_lock=true boot2_persistent_fault=true "
              r"pre_terminal_daemon_processes_stable=true "
              r"cgroups_exact=true pre_terminal_capabilities_exact=true ambient_zero=true "
              r"no_new_privs=true core_limits_zero=true swaps_empty=true "
              r"shell_mount_absent=true provider_configured=true "
              r"production_executor_unit_binds_to_exact=true "
              r"production_executor_status_path=true conditioned_agent_binds_to_runtime=true "
              r"codex_status_path=true "
              r"production_ui_provider_relay_path=true "
              r"signed_report_path=true "
              r"normal_triple_release=true lifecycle_marker_active_before_borrow=true "
              r"hold_killed_vaultd=true helper_binds_to_terminated=true "
              r"worker_pdeath_cleanup=true test_trigger_sockets_gone=true "
              r"unit_credentials_cleaned=true persistent_fault_status_only=true "
              r"lifecycle_marker_persisted=true provider_network_used=false "
              r"tls_openai_qualified=false residue_absent=true qmp_acpi_shutdowns=2 "
              rf"uefi_vars={expected_uefi_vars} ready=true"
          )
          patterns = (
              ("failure", failure),
              ("boot", boot),
              ("raw", raw),
              ("attestation", attestation),
          )
          kinds = []
          boots = []
          boot_contracts = []
          for line in lines:
              if len(line) > 2048:
                  raise SystemExit("lifecycle output line was too long")
              for kind, pattern in patterns:
                  match = pattern.fullmatch(line)
                  if match is not None:
                      kinds.append(kind)
                      if kind == "boot":
                          boots.append(match.group(1))
                          boot_contracts.append(match.groups())
                      break
              else:
                  raise SystemExit("lifecycle output was outside the allowlist")
          if status == 0:
              expected_contracts = [
                  ("1", "clean-lock", *("false",) * 7),
                  ("2", "persistent-fault", *("true",) * 7),
              ]
              if (
                  kinds != ["boot", "boot", "raw", "attestation"]
                  or boots != ["1", "2"]
                  or boot_contracts != expected_contracts
              ):
                  raise SystemExit("successful lifecycle output was incomplete")
          elif "failure" not in kinds or "raw" in kinds or "attestation" in kinds:
              raise SystemExit("failed lifecycle output was not fail-closed")

          temporary_path = safe_path.with_name(safe_path.name + ".tmp")
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW
          descriptor = os.open(temporary_path, flags, 0o600)
          published = False
          try:
              with os.fdopen(descriptor, "wb") as stream:
                  stream.write(payload)
                  stream.flush()
                  os.fsync(stream.fileno())
              os.link(temporary_path, safe_path, follow_symlinks=False)
              os.unlink(temporary_path)
              final = os.stat(safe_path, follow_symlinks=False)
              if (
                  not safe_path.is_file()
                  or final.st_nlink != 1
                  or final.st_size != len(payload)
                  or final.st_uid != os.geteuid()
                  or final.st_mode & 0o7777 != 0o600
              ):
                  raise SystemExit("sanitized lifecycle evidence was not durable")
              directory = os.open(
                  safe_path.parent,
                  os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC,
              )
              try:
                  os.fsync(directory)
              finally:
                  os.close(directory)
              published = True
          finally:
              try:
                  os.unlink(temporary_path)
              except FileNotFoundError:
                  pass
              if not published:
                  try:
                      os.unlink(safe_path)
                  except FileNotFoundError:
                      pass
          PY

          exit "$harness_status"
