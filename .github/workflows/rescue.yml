name: rescue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rescue/**"
      - "tools/build-rescue/**"
      - "tools/make-device/catalog-entry.py"
      - "tools/make-device/catalog-entry-v2.py"
      - "tools/make-device/catalog_v2.py"
      - "tools/make-device/make-device.py"
      - "tools/make-device/make_device_v2.py"
      - "tools/make-device/trusted-rescue-images.v2.schema.json"
      - "apps/desk/**"
      - "packs/linux/**"
      - "tests/fixtures/linux-hardware-inventory/**"
      - "tests/fixtures/linux-normalized-snapshot/**"
      - "tests/integration/linux-snapshot-resident-ipc.sh"
      - "tests/integration/run-linux-snapshot-resident-ipc-ci.sh"
      - "tools/test-linux-snapshot/**"
      - "justfile"
      - "crates/rescue-secrets/**"
      - "crates/evidence/**"
      - "crates/rescue-openai-executor/**"
      - "crates/rescue-codex-bridge/**"
      - "crates/linux-nsfs/**"
      - "crates/rescue-openai-provider/**"
      - "crates/report-schema/**"
      - "crates/protocol/**"
      - "crates/storage/**"
      - "crates/device-identity/**"
      - "services/agent-gateway/**"
      - "packages/provider-types/**"
      - "packages/schemas/**"
      - "packages/session-driver/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/rescue.yml"
permissions: { contents: read }
jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: "rustfmt, clippy"
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kernaid/desk build
      - name: Install VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cryptsetup dosfstools e2fsprogs gdisk mtools ntfs-3g \
            ovmf qemu-system-x86 shellcheck udev util-linux
      - name: Harden OVMF firmware ancestry
        run: |
          sudo /usr/bin/python3 -I -B - <<'PY'
          import os
          import stat

          directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
          opened = []

          def validate_trusted(descriptor):
              current = os.fstat(descriptor)
              if (
                  not stat.S_ISDIR(current.st_mode)
                  or current.st_uid != 0
                  or current.st_gid != 0
                  or stat.S_IMODE(current.st_mode) & 0o022
              ):
                  raise RuntimeError("OVMF ancestry entry is not trusted")

          def harden(descriptor):
              before = os.fstat(descriptor)
              if not stat.S_ISDIR(before.st_mode):
                  raise RuntimeError("OVMF ancestry entry is not a directory")
              os.fchown(descriptor, 0, 0)
              os.fchmod(descriptor, stat.S_IMODE(before.st_mode) & ~0o022)
              validate_trusted(descriptor)

          def open_child(parent, name, *, required):
              try:
                  descriptor = os.open(name, directory_flags, dir_fd=parent)
              except FileNotFoundError:
                  if required:
                      raise
                  return None
              opened.append(descriptor)
              harden(descriptor)
              return descriptor

          try:
              root = os.open("/", directory_flags)
              opened.append(root)
              validate_trusted(root)
              usr = open_child(root, "usr", required=True)
              share = open_child(usr, "share", required=True)
              open_child(share, "OVMF", required=True)
              open_child(share, "edk2", required=False)
          finally:
              for descriptor in reversed(opened):
                  os.close(descriptor)
          PY
      - name: Install Resident IPC probe prerequisites
        run: |
          sudo apt-get install -y \
            pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev procps
      - name: Validate Rescue image-layout tooling
        run: |
          python3 -m unittest discover -s tools/build-rescue/tests -p 'test_*.py' -v
          bash -n tools/build-rescue/build.sh \
            tools/build-rescue/qemu-smoke.sh \
            tools/build-rescue/qemu-with-resident-snapshot.sh \
            tools/build-rescue/qemu-usb-smoke.sh \
            tools/build-rescue/qemu-vault-lifecycle-smoke.sh \
            tests/integration/linux-snapshot-resident-ipc.sh \
            tests/integration/run-linux-snapshot-resident-ipc-ci.sh
          shellcheck tools/build-rescue/build.sh \
            tools/build-rescue/qemu-smoke.sh \
            tools/build-rescue/qemu-with-resident-snapshot.sh \
            tools/build-rescue/qemu-usb-smoke.sh \
            tools/build-rescue/qemu-vault-lifecycle-smoke.sh \
            tests/integration/linux-snapshot-resident-ipc.sh \
            tests/integration/run-linux-snapshot-resident-ipc-ci.sh
          python3 -I -B -c 'from pathlib import Path; path = Path("tools/test-linux-snapshot/sanitize_e2e.py"); compile(path.read_bytes(), str(path), "exec", dont_inherit=True)'
          python3 -I -B -c 'from pathlib import Path; path = Path("tools/test-linux-snapshot/tree_fingerprint.py"); compile(path.read_bytes(), str(path), "exec", dont_inherit=True)'
          python3 -I -B -c 'from pathlib import Path; path = Path("tools/build-rescue/qemu-vault-lifecycle-pty.py"); compile(path.read_bytes(), str(path), "exec", dont_inherit=True)'
          python3 -I -B -c 'from pathlib import Path; path = Path("tools/build-rescue/provider-lease-probe.py"); compile(path.read_bytes(), str(path), "exec", dont_inherit=True)'
          python3 -I -B -c 'from pathlib import Path; path = Path("tools/build-rescue/qemu-tauri-ui-smoke.py"); compile(path.read_bytes(), str(path), "exec", dont_inherit=True)'
          python3 -I -B -c 'from pathlib import Path; path = Path("rescue/live-build/config/includes.chroot/usr/lib/kernaid/tauri_ui_ready_check.py"); compile(path.read_bytes(), str(path), "exec", dont_inherit=True)'
      - name: Exercise Resident snapshot through Tauri IPC in a rootless chroot
        shell: bash
        run: |
          resident_evidence="$RUNNER_TEMP/kernaid-linux-snapshot-resident.e2e.log"
          ./tests/integration/run-linux-snapshot-resident-ipc-ci.sh \
            >"$resident_evidence"
          resident_line="$(cat "$resident_evidence")"
          if [[ ! "$resident_line" =~ ^KERNAID_RESIDENT_LINUX_SNAPSHOT_E2E_V1\ semantic_sha256=([0-9a-f]{64})$ ]]; then
            echo "Resident snapshot evidence was outside the allowlist" >&2
            exit 1
          fi
          printf 'KERNAID_RESIDENT_SNAPSHOT_SEMANTIC_SHA256=%s\n' \
            "${BASH_REMATCH[1]}" >>"$GITHUB_ENV"
      - name: Build the host-only Rescue vault lifecycle probe
        run: |
          cargo fmt -p kernaid-rescue-secrets -- --check
          cargo build --locked --release -p kernaid-rescue-secrets \
            --features privileged-probe --bin kernaid-rescue-vault-probe
      - name: Publish the host-only lifecycle probe input
        uses: actions/upload-artifact@v4
        with:
          name: KernAid-Rescue-vault-lifecycle-probe-input
          path: target/release/kernaid-rescue-vault-probe
          if-no-files-found: error
          retention-days: 1
      - name: Build the in-guest Rescue shipping binaries
        run: |
          cargo fmt -p kernaid-linux-nsfs -- --check
          cargo clippy --locked -p kernaid-linux-nsfs --all-targets -- -D warnings
          cargo test --locked -p kernaid-linux-nsfs
          cargo clippy --locked -p kernaid-rescue-secrets --all-targets \
            --features experimental-codex-home-lease -- -D warnings
          cargo test --locked -p kernaid-rescue-secrets \
            --features experimental-codex-home-lease -- --test-threads=1
          cargo fmt -p kernaid-rescue-openai-executor -- --check
          cargo clippy --locked -p kernaid-rescue-openai-executor --all-targets -- -D warnings
          cargo test --locked -p kernaid-rescue-openai-executor
          cargo fmt -p kernaid-rescue-codex-bridge -- --check
          cargo clippy --locked -p kernaid-rescue-codex-bridge --all-targets -- -D warnings
          cargo test --locked -p kernaid-rescue-codex-bridge
          cargo build --locked --release -p kernaid-rescue-secrets \
            --features experimental-codex-home-lease \
            --bin kernaid-rescue-vaultd \
            --bin kernaid-rescue-vaultctl \
            --bin kernaid-rescue-codex-mounter
          cargo build --locked --release -p kernaid-rescue-openai-executor \
            --bin kernaid-rescue-openai-executor
          cargo build --locked --release -p kernaid-linux-pack \
            --bin kernaid-linux-hardware-inventory
          cargo build --locked --release -p kernaid-rescue-codex-bridge \
            --bin kernaid-rescue-codex \
            --bin kernaid-codex-auth
          cargo fmt -p kernaid-rescue-desk-shell -- --check
          cargo clippy --locked -p kernaid-rescue-desk-shell \
            --all-targets -- -D warnings
          cargo test --locked -p kernaid-rescue-desk-shell \
            --all-targets
          cargo build --locked --release -p kernaid-rescue-desk-shell \
            --bin kernaid-rescue-desk-shell
      - name: Verify the in-guest Rescue binary ABI
        run: |
          preflight_dir="$(sudo /usr/bin/mktemp -d /root/kernaid-rescue-shipping-preflight.XXXXXXXX)"
          cleanup_preflight() {
            sudo unlink -- "$preflight_dir/kernaid-rescue-vaultd" 2>/dev/null || true
            sudo unlink -- "$preflight_dir/kernaid-rescue-codex-mounter" 2>/dev/null || true
            sudo unlink -- "$preflight_dir/kernaid-rescue-vaultctl" 2>/dev/null || true
            sudo unlink -- "$preflight_dir/kernaid-rescue-openai-executor" 2>/dev/null || true
            sudo unlink -- "$preflight_dir/kernaid-linux-hardware-inventory" 2>/dev/null || true
            sudo unlink -- "$preflight_dir/kernaid-rescue-codex" 2>/dev/null || true
            sudo unlink -- "$preflight_dir/kernaid-codex-auth" 2>/dev/null || true
            sudo unlink -- "$preflight_dir/kernaid-rescue-desk-shell" 2>/dev/null || true
            sudo rmdir -- "$preflight_dir" 2>/dev/null || true
          }
          trap cleanup_preflight EXIT
          if [[ ! "$preflight_dir" =~ ^/root/kernaid-rescue-shipping-preflight\.[A-Za-z0-9]{8}$ ]]; then
            exit 2
          fi
          test "$(sudo /usr/bin/stat -c '%u:%g:%a' "$preflight_dir")" = "0:0:700"
          sudo install -o root -g root -m 0755 \
            target/release/kernaid-rescue-vaultd \
            "$preflight_dir/kernaid-rescue-vaultd"
          sudo install -o root -g root -m 0755 \
            target/release/kernaid-rescue-codex-mounter \
            "$preflight_dir/kernaid-rescue-codex-mounter"
          sudo install -o root -g root -m 0755 \
            target/release/kernaid-rescue-vaultctl \
            "$preflight_dir/kernaid-rescue-vaultctl"
          sudo install -o root -g root -m 0755 \
            target/release/kernaid-rescue-openai-executor \
            "$preflight_dir/kernaid-rescue-openai-executor"
          sudo install -o root -g root -m 0755 \
            target/release/kernaid-linux-hardware-inventory \
            "$preflight_dir/kernaid-linux-hardware-inventory"
          sudo install -o root -g root -m 0755 \
            target/release/kernaid-rescue-codex \
            "$preflight_dir/kernaid-rescue-codex"
          sudo install -o root -g root -m 0755 \
            target/release/kernaid-codex-auth \
            "$preflight_dir/kernaid-codex-auth"
          sudo install -o root -g root -m 0755 \
            target/release/kernaid-rescue-desk-shell \
            "$preflight_dir/kernaid-rescue-desk-shell"
          sudo /usr/bin/python3 -I tools/build-rescue/verify-shipping-binary.py \
            "$preflight_dir/kernaid-rescue-vaultd"
          sudo /usr/bin/python3 -I tools/build-rescue/verify-shipping-binary.py \
            "$preflight_dir/kernaid-rescue-codex-mounter"
          sudo /usr/bin/python3 -I tools/build-rescue/verify-shipping-binary.py \
            "$preflight_dir/kernaid-rescue-vaultctl"
          sudo /usr/bin/python3 -I tools/build-rescue/verify-shipping-binary.py \
            "$preflight_dir/kernaid-rescue-openai-executor"
          sudo /usr/bin/python3 -I tools/build-rescue/verify-shipping-binary.py \
            "$preflight_dir/kernaid-linux-hardware-inventory"
          sudo /usr/bin/python3 -I tools/build-rescue/verify-shipping-binary.py \
            "$preflight_dir/kernaid-rescue-codex"
          sudo /usr/bin/python3 -I tools/build-rescue/verify-shipping-binary.py \
            "$preflight_dir/kernaid-codex-auth"
          sudo /usr/bin/python3 -I tools/build-rescue/verify-shipping-binary.py \
            --profile tauri-webkit "$preflight_dir/kernaid-rescue-desk-shell"
      - name: Build hybrid BIOS and UEFI ISO
        run: |
          docker run --rm --privileged \
            -e KERNAID_DESK_PREBUILT=1 \
            -e KERNAID_RESCUE_VAULTD_BINARY=/workspace/target/release/kernaid-rescue-vaultd \
            -e KERNAID_RESCUE_CODEX_MOUNTER_BINARY=/workspace/target/release/kernaid-rescue-codex-mounter \
            -e KERNAID_RESCUE_VAULTCTL_BINARY=/workspace/target/release/kernaid-rescue-vaultctl \
            -e KERNAID_RESCUE_OPENAI_EXECUTOR_BINARY=/workspace/target/release/kernaid-rescue-openai-executor \
            -e KERNAID_LINUX_HARDWARE_INVENTORY_BINARY=/workspace/target/release/kernaid-linux-hardware-inventory \
            -e KERNAID_RESCUE_CODEX_BRIDGE_BINARY=/workspace/target/release/kernaid-rescue-codex \
            -e KERNAID_RESCUE_CODEX_CLIENT_BINARY=/workspace/target/release/kernaid-codex-auth \
            -e KERNAID_RESCUE_CODEX_CLI_BINARY=/opt/kernaid-codex-root/usr/lib/kernaid/codex \
            -e KERNAID_RESCUE_DESK_SHELL_BINARY=/workspace/target/release/kernaid-rescue-desk-shell \
            -v "$PWD:/workspace" -w /workspace \
            debian:trixie-slim \
            sh -c 'apt-get update && apt-get install -y binutils live-build ca-certificates openssl python3 && install -d -o root -g root -m 0755 /opt/kernaid-codex-root/usr/lib/kernaid && python3 -I tools/build-rescue/fetch-codex-cli.py --lock rescue/codex/codex-cli.lock.json --root /opt/kernaid-codex-root && ./tools/build-rescue/build.sh'
      - name: Generate the pinned Codex SBOM tranche
        run: |
          python3 -I tools/build-rescue/generate-rescue-sbom.py \
            --lock rescue/codex/codex-cli.lock.json \
            --output KernAid-Rescue-amd64.codex.cdx.json
      - name: QEMU BIOS smoke test
        run: KERNAID_SMOKE_LOG=rescue-smoke-bios.log ./tools/build-rescue/qemu-smoke.sh bios
      - name: QEMU UEFI smoke test
        run: KERNAID_SMOKE_LOG=rescue-smoke-uefi.log ./tools/build-rescue/qemu-smoke.sh uefi
      - name: Publish only allowlisted Resident and Rescue snapshot digests
        run: |
          python3 -I -B tools/test-linux-snapshot/sanitize_e2e.py \
            --resident "$RUNNER_TEMP/kernaid-linux-snapshot-resident.e2e.log" \
            --bios "$PWD/rescue-smoke-bios.log" \
            --uefi "$PWD/rescue-smoke-uefi.log" \
            --output "$RUNNER_TEMP/kernaid-linux-snapshot-e2e.sanitized.log"
      - name: QEMU BIOS USB-style two-boot smoke test
        run: |
          log="$PWD/rescue-usb-smoke-bios.log"
          : >"$log"
          chmod 0644 "$log"
          sudo env KERNAID_USB_SMOKE_LOG="$log" \
            "$PWD/tools/build-rescue/qemu-usb-smoke.sh" bios \
            "$PWD/KernAid-Rescue-amd64.iso" \
            "$PWD/target/release/kernaid-rescue-vault-probe"
          test -r "$log"
          test "$(stat -c '%u:%a' "$log")" = "$(id -u):644"
      - name: QEMU UEFI USB-style two-boot smoke test
        run: |
          log="$PWD/rescue-usb-smoke-uefi.log"
          : >"$log"
          chmod 0644 "$log"
          sudo env KERNAID_USB_SMOKE_LOG="$log" \
            "$PWD/tools/build-rescue/qemu-usb-smoke.sh" uefi \
            "$PWD/KernAid-Rescue-amd64.iso" \
            "$PWD/target/release/kernaid-rescue-vault-probe"
          test -r "$log"
          test "$(stat -c '%u:%a' "$log")" = "$(id -u):644"
      - name: Derive catalog entry from the tested ISO and attested QEMU logs
        env:
          KERNAID_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KERNAID_ARTIFACT_VERSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          iso_sha256="$(sha256sum KernAid-Rescue-amd64.iso | awk '{print $1}')"
          /usr/bin/python3 -I ./tools/make-device/catalog-entry.py \
            --iso "$PWD/KernAid-Rescue-amd64.iso" \
            --sha256 "$iso_sha256" \
            --artifact-version "$KERNAID_ARTIFACT_VERSION" \
            --bios-run-id "$GITHUB_RUN_ID" \
            --bios-run-url "$KERNAID_RUN_URL" \
            --bios-log "$PWD/rescue-smoke-bios.log" \
            --uefi-run-id "$GITHUB_RUN_ID" \
            --uefi-run-url "$KERNAID_RUN_URL" \
            --uefi-log "$PWD/rescue-smoke-uefi.log" \
            > KernAid-Rescue-amd64.catalog-entry.json
          /usr/bin/python3 -m json.tool \
            KernAid-Rescue-amd64.catalog-entry.json >/dev/null
      - name: Derive and validate the inactive catalog-v2 evidence artifact
        env:
          KERNAID_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KERNAID_ARTIFACT_VERSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          iso_sha256="$(sha256sum KernAid-Rescue-amd64.iso | awk '{print $1}')"
          /usr/bin/python3 -I ./tools/make-device/catalog-entry-v2.py \
            --iso "$PWD/KernAid-Rescue-amd64.iso" \
            --sha256 "$iso_sha256" \
            --layout-manifest "$PWD/rescue/image-layout/device-layout.v1.json" \
            --artifact-version "$KERNAID_ARTIFACT_VERSION" \
            --bios-run-id "$GITHUB_RUN_ID" \
            --bios-run-url "$KERNAID_RUN_URL" \
            --bios-log "$PWD/rescue-usb-smoke-bios.log" \
            --uefi-run-id "$GITHUB_RUN_ID" \
            --uefi-run-url "$KERNAID_RUN_URL" \
            --uefi-log "$PWD/rescue-usb-smoke-uefi.log" \
            > KernAid-Rescue-amd64.catalog-entry-v2.json
          /usr/bin/python3 -m json.tool \
            KernAid-Rescue-amd64.catalog-entry-v2.json >/dev/null
          /usr/bin/python3 -I -B - \
            "$PWD/tools/make-device/catalog_v2.py" \
            "$PWD/KernAid-Rescue-amd64.catalog-entry-v2.json" <<'PY'
          import json
          import sys
          import types
          from pathlib import Path

          module_path = Path(sys.argv[1])
          entry_path = Path(sys.argv[2])
          module = types.ModuleType("kernaid_catalog_v2_artifact_gate")
          module.__file__ = str(module_path)
          sys.modules[module.__name__] = module
          source = module_path.read_bytes()
          exec(compile(source, str(module_path), "exec", dont_inherit=True), module.__dict__)
          entry = json.loads(entry_path.read_text(encoding="utf-8"))
          catalog = {
              "schema": "dev.kernaid.trusted-rescue-images.v2",
              "catalogRevision": 1,
              "images": [entry],
          }
          parsed = module.parse_trust_catalog_v2(
              json.dumps(catalog, sort_keys=True, separators=(",", ":"))
          )
          if len(parsed.images) != 1:
              raise SystemExit("catalog-v2 artifact did not validate exactly once")
          PY
      - name: Publish smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KernAid-Rescue-smoke-logs
          path: |
            rescue-smoke-*.log
            rescue-usb-smoke-*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Publish sanitized Linux snapshot E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: KernAid-Linux-snapshot-e2e-evidence
          path: ${{ runner.temp }}/kernaid-linux-snapshot-e2e.sanitized.log
          if-no-files-found: error
          retention-days: 14
      - name: Publish checksums and image
        uses: actions/upload-artifact@v4
        with:
          name: KernAid-Rescue-amd64
          path: |
            KernAid-Rescue-amd64.iso
            KernAid-Rescue-amd64.iso.sha256
            KernAid-Rescue-amd64.catalog-entry.json
            KernAid-Rescue-amd64.catalog-entry-v2.json
            KernAid-Rescue-amd64.codex.cdx.json
          if-no-files-found: error
          retention-days: 14

  vault-lifecycle-bios:
    needs: build-and-smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated lifecycle VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            coreutils cryptsetup e2fsprogs gawk grep libcrypt1 mount ovmf procps \
            python3 qemu-system-x86 squashfs-tools udev util-linux
      - name: Harden OVMF firmware ancestry
        run: |
          sudo /usr/bin/python3 -I -B - <<'PY'
          import os
          import stat

          directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
          opened = []

          def validate_trusted(descriptor):
              current = os.fstat(descriptor)
              if (
                  not stat.S_ISDIR(current.st_mode)
                  or current.st_uid != 0
                  or current.st_gid != 0
                  or stat.S_IMODE(current.st_mode) & 0o022
              ):
                  raise RuntimeError("OVMF ancestry entry is not trusted")

          def harden(descriptor):
              before = os.fstat(descriptor)
              if not stat.S_ISDIR(before.st_mode):
                  raise RuntimeError("OVMF ancestry entry is not a directory")
              os.fchown(descriptor, 0, 0)
              os.fchmod(descriptor, stat.S_IMODE(before.st_mode) & ~0o022)
              validate_trusted(descriptor)

          def open_child(parent, name, *, required):
              try:
                  descriptor = os.open(name, directory_flags, dir_fd=parent)
              except FileNotFoundError:
                  if required:
                      raise
                  return None
              opened.append(descriptor)
              harden(descriptor)
              return descriptor

          try:
              root = os.open("/", directory_flags)
              opened.append(root)
              validate_trusted(root)
              usr = open_child(root, "usr", required=True)
              share = open_child(usr, "share", required=True)
              open_child(share, "OVMF", required=True)
              open_child(share, "edk2", required=False)
          finally:
              for descriptor in reversed(opened):
                  os.close(descriptor)
          PY
      - name: Download the tested Rescue image input
        uses: actions/download-artifact@v4
        with:
          name: KernAid-Rescue-amd64
          path: ${{ runner.temp }}/kernaid-vault-lifecycle-bios/image
      - name: Download the host-only lifecycle probe input
        uses: actions/download-artifact@v4
        with:
