name: media-creator-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-build-windows-x86-64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install Windows GNU linker
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64
      - name: Targeted core tests
        run: cargo test --locked -p kernaid-media-creator-core
      - name: Cross-build unsigned Windows executable
        run: >-
          cargo build --locked --release
          --target x86_64-pc-windows-gnu
          -p kernaid-media-creator-windows
          --features windows-cli
      - name: Upload explicitly unsigned development binary
        uses: actions/upload-artifact@v4
        with:
          name: KernAid-Media-Creator-windows-x86_64-UNSIGNED
          path: target/x86_64-pc-windows-gnu/release/kernaid-media-creator.exe
          if-no-files-found: error
          retention-days: 7
