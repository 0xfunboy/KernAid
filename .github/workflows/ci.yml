name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: "rustfmt, clippy"
      - name: Install Tauri Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev procps util-linux
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check the disabled Repair Vault contract and store
        run: |
          cargo clippy --locked -p kernaid-protocol --all-targets \
            --features experimental-repair-store -- -D warnings
          cargo test --locked -p kernaid-protocol \
            --features experimental-repair-store
          cargo clippy --locked -p kernaid-rescue-secrets --all-targets \
            --features experimental-repair-store -- -D warnings
          cargo test --locked -p kernaid-rescue-secrets \
            --features experimental-repair-store -- --test-threads=1
      - name: Clippy fixture repair Linux pack feature
        run: cargo clippy --locked -p kernaid-linux-pack --all-targets --features fixture-repair-lab -- -D warnings
      - name: Test fixture repair Linux pack feature
        run: cargo test --locked -p kernaid-linux-pack --features fixture-repair-lab
      - name: Check the disabled Rescue fstab production candidate
        run: |
          cargo clippy --locked -p kernaid-policy --all-targets \
            --features rescue-fstab-production-candidate -- -D warnings
          cargo test --locked -p kernaid-policy \
            --features rescue-fstab-production-candidate
          cargo clippy --locked -p kernaid-core --all-targets \
            --features rescue-fstab-production-candidate -- -D warnings
          cargo test --locked -p kernaid-core \
            --features rescue-fstab-production-candidate
          cargo clippy --locked -p kernaid-broker --all-targets \
            --features rescue-fstab-production-candidate -- -D warnings
          cargo test --locked -p kernaid-broker \
            --features rescue-fstab-production-candidate
          cargo clippy --locked -p kernaid-linux-pack --all-targets \
            --features rescue-fstab-production-candidate -- -D warnings
          cargo test --locked -p kernaid-linux-pack \
            --features rescue-fstab-production-candidate
      - name: Clippy fixture repair broker feature
        run: cargo clippy --locked -p kernaid-broker --all-targets --features fixture-repair-lab -- -D warnings
      - name: Test fixture repair broker feature
        run: cargo test --locked -p kernaid-broker --features fixture-repair-lab
      - name: Test fixture repair Core admission
        run: cargo test --locked -p kernaid-core --features fixture-repair-lab
      - name: Compile and exercise the isolated Desk repair cycle
        run: cargo test --locked -p kernaid-desk-shell --features fixture-repair-lab fixture_repair_lab::tests
      - name: Prove Observe fixture makes zero writes
        run: ./tests/integration/observe-zero-writes.sh
      - name: Prove snapshot parity without content or tracked-metadata changes
        run: bash ./tests/integration/linux-snapshot-parity.sh
      - name: Exercise the production Resident snapshot command through Tauri IPC
        shell: bash
        run: ./tests/integration/run-linux-snapshot-resident-ipc-ci.sh
      - name: Test Rescue authorization boundary
        run: python3 -m unittest discover -s tests/rescue -p 'test_*.py'
      - name: Test release-channel canonicalization and tamper rejection
        run: python3 -I -B -m unittest discover -s tools/release/tests -p 'test_*.py'
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate versioned schemas
        run: ./tools/verify-release/validate-schemas.sh
      - run: pnpm check
      - run: pnpm test
