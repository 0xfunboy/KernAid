name: rescue repair candidate

on:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - name: Build Desk
        run: |
          test "$(node --version)" = "v24.18.0"
          pnpm install --frozen-lockfile
          KERNAID_REPAIR_CANDIDATE=1 pnpm --filter @kernaid/desk build

      - name: Install build and VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cryptsetup dosfstools e2fsprogs gdisk mtools ntfs-3g \
            ovmf pkg-config qemu-system-x86 shellcheck squashfs-tools udev util-linux xorriso \
            libdbus-1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev procps

      - name: Validate crypttab rollback contracts
        run: |
          pnpm --filter @kernaid/desk exec tsx --test test/rescue-repair.test.ts
          cargo test --locked -p kernaid-policy \
            --features rescue-crypttab-production-candidate \
            rollback_is_a_distinct_non_recursive_closed_plan
          cargo test --locked -p kernaid-core \
            --features rescue-fstab-production-candidate,rescue-crypttab-production-candidate \
            crypttab_rollback_plan_and_approval_cannot_cross_bind_fstab
          cargo test --locked -p kernaid-protocol \
            --features experimental-repair-store \
            crypttab_intent_lease_and_metadata_are_resource_distinct
          cargo test --locked -p kernaid-broker \
            --features rescue-fstab-production-candidate,rescue-crypttab-production-candidate,rescue-ext4-fsck-production-candidate,rescue-resolver-link-production-candidate \
            crypttab_rollback_is_resource_bound_and_uses_a_fresh_typed_approval

      - name: Harden OVMF firmware ancestry
        run: |
          sudo /usr/bin/python3 -I -B - <<'PY'
          import os
          import stat

          directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
          opened = []

          def validate_trusted(descriptor):
              current = os.fstat(descriptor)
              if (
                  not stat.S_ISDIR(current.st_mode)
                  or current.st_uid != 0
                  or current.st_gid != 0
                  or stat.S_IMODE(current.st_mode) & 0o022
              ):
                  raise RuntimeError("OVMF ancestry entry is not trusted")

          def harden(descriptor):
              before = os.fstat(descriptor)
              if not stat.S_ISDIR(before.st_mode):
                  raise RuntimeError("OVMF ancestry entry is not a directory")
              os.fchown(descriptor, 0, 0)
              os.fchmod(descriptor, stat.S_IMODE(before.st_mode) & ~0o022)
              validate_trusted(descriptor)

          def open_child(parent, name, *, required):
              try:
                  descriptor = os.open(name, directory_flags, dir_fd=parent)
              except FileNotFoundError:
                  if required:
                      raise
                  return None
              opened.append(descriptor)
              harden(descriptor)
              return descriptor

          try:
              root = os.open("/", directory_flags)
              opened.append(root)
              validate_trusted(root)
              usr = open_child(root, "usr", required=True)
              share = open_child(usr, "share", required=True)
              open_child(share, "OVMF", required=True)
              open_child(share, "edk2", required=False)
          finally:
              for descriptor in reversed(opened):
                  os.close(descriptor)
          PY

      - name: Validate candidate packaging and shell syntax
        run: |
          python3 -B -m unittest \
            tools/build-rescue/tests/test_repair_candidate_packaging.py \
            tools/build-rescue/tests/test_repair_qualification.py \
            tools/build-rescue/tests/test_repair_surface_separation.py \
            tools/build-rescue/tests/test_qemu_repair_candidate_smoke.py \
            tools/build-rescue/tests/test_verify_retail_image.py \
            tools/build-rescue/tests/test_live_image_vault_packaging.py -v
          python3 -I -B -c 'from pathlib import Path; path = Path("tools/build-rescue/repair-qualification.py"); compile(path.read_bytes(), str(path), "exec", dont_inherit=True)'
          python3 -I -B -c 'from pathlib import Path; path = Path("tools/build-rescue/qemu-repair-vault-tamper.py"); compile(path.read_bytes(), str(path), "exec", dont_inherit=True)'
          bash -n tools/build-rescue/build.sh tools/build-rescue/qemu-smoke.sh \
            tools/build-rescue/qemu-repair-candidate-smoke.sh
          shellcheck tools/build-rescue/build.sh tools/build-rescue/qemu-smoke.sh \
            tools/build-rescue/qemu-repair-candidate-smoke.sh
          pnpm exec prettier --check \
            .github/workflows/rescue-repair-candidate.yml

      - name: Build standard Rescue binaries and repair candidate daemon
        run: |
          cargo build --locked --release -p kernaid-rescue-secrets \
            --features experimental-codex-home-lease,experimental-firstboot-provisioner,experimental-repair-store \
            --bin kernaid-rescue-vaultd \
            --bin kernaid-rescue-vaultctl \
            --bin kernaid-rescue-codex-mounter \
            --bin kernaid-rescue-firstboot
          cargo build --locked --release -p kernaid-rescue-openai-executor \
            --bin kernaid-rescue-openai-executor
          cargo build --locked --release -p kernaid-linux-pack \
            --bin kernaid-linux-hardware-inventory \
            --bin kernaid-linux-storage-health \
            --bin kernaid-linux-filesystem-health \
            --bin kernaid-linux-boot-critical-path
          cargo build --locked --release -p kernaid-rescue-codex-bridge \
            --bin kernaid-rescue-codex \
            --bin kernaid-codex-auth
          cargo build --locked --release -p kernaid-rescue-desk-shell \
            --features custom-protocol \
            --bin kernaid-rescue-desk-shell
          cargo build --locked --release -p kernaid-broker \
            --features rescue-fstab-production-candidate,rescue-crypttab-production-candidate,rescue-ext4-fsck-production-candidate,rescue-resolver-link-production-candidate \
            --bin kernaid-rescue-repaird
          cargo build --locked --release -p kernaid-linux-blockfd \
            --bin kernaid-blockfd-probe

      - name: Build isolated repair candidate ISO
        run: |
          docker run --rm --privileged \
            -e KERNAID_DESK_PREBUILT=1 \
            -e KERNAID_REPAIR_CANDIDATE=1 \
            -e KERNAID_RESCUE_REPAIRD_BINARY=/workspace/target/release/kernaid-rescue-repaird \
            -e KERNAID_BLOCKFD_PROBE_BINARY=/workspace/target/release/kernaid-blockfd-probe \
            -e KERNAID_RESCUE_VAULTD_BINARY=/workspace/target/release/kernaid-rescue-vaultd \
            -e KERNAID_RESCUE_FIRSTBOOT_BINARY=/workspace/target/release/kernaid-rescue-firstboot \
            -e KERNAID_RESCUE_CODEX_MOUNTER_BINARY=/workspace/target/release/kernaid-rescue-codex-mounter \
            -e KERNAID_RESCUE_VAULTCTL_BINARY=/workspace/target/release/kernaid-rescue-vaultctl \
            -e KERNAID_RESCUE_OPENAI_EXECUTOR_BINARY=/workspace/target/release/kernaid-rescue-openai-executor \
            -e KERNAID_LINUX_HARDWARE_INVENTORY_BINARY=/workspace/target/release/kernaid-linux-hardware-inventory \
            -e KERNAID_LINUX_STORAGE_HEALTH_BINARY=/workspace/target/release/kernaid-linux-storage-health \
            -e KERNAID_LINUX_FILESYSTEM_HEALTH_BINARY=/workspace/target/release/kernaid-linux-filesystem-health \
            -e KERNAID_LINUX_BOOT_CRITICAL_PATH_BINARY=/workspace/target/release/kernaid-linux-boot-critical-path \
            -e KERNAID_RESCUE_CODEX_BRIDGE_BINARY=/workspace/target/release/kernaid-rescue-codex \
            -e KERNAID_RESCUE_CODEX_CLIENT_BINARY=/workspace/target/release/kernaid-codex-auth \
            -e KERNAID_RESCUE_CODEX_CLI_BINARY=/opt/kernaid-codex-root/usr/lib/kernaid/codex \
            -e KERNAID_RESCUE_DESK_SHELL_BINARY=/workspace/target/release/kernaid-rescue-desk-shell \
            -v "$PWD:/workspace" -w /workspace \
            debian:trixie-slim \
            sh -c 'apt-get update && apt-get install -y binutils live-build ca-certificates openssl python3 && install -d -o root -g root -m 0755 /opt/kernaid-codex-root/usr/lib/kernaid && python3 -I tools/build-rescue/fetch-codex-cli.py --lock rescue/codex/codex-cli.lock.json --root /opt/kernaid-codex-root && ./tools/build-rescue/build.sh'

      - name: Verify candidate checksum
        run: |
          test -f KernAid-Rescue-amd64-repair-candidate.iso
          test -f KernAid-Rescue-amd64-repair-candidate.iso.sha256
          sha256sum --check --strict \
            KernAid-Rescue-amd64-repair-candidate.iso.sha256
          python3 -I -B tools/build-rescue/verify-repair-surface.py --mode candidate --iso KernAid-Rescue-amd64-repair-candidate.iso

      - name: Bind smoke tests to the shared snapshot fixture
        shell: bash
        run: |
          semantic_sha256="$(python3 -I -B - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          snapshot = json.loads(
              Path(
                  "tests/fixtures/linux-normalized-snapshot/expected/snapshot.v1.json"
              ).read_text(encoding="utf-8")
          )
          canonical = json.dumps(
              snapshot,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          print(
              hashlib.sha256(
                  b"KERNAID_LINUX_NORMALIZED_SNAPSHOT_E2E_SEMANTIC_V1\0"
                  + canonical
              ).hexdigest()
          )
          PY
          )"
          test "${#semantic_sha256}" -eq 64
          printf 'KERNAID_RESIDENT_SNAPSHOT_SEMANTIC_SHA256=%s\n' \
            "$semantic_sha256" >>"$GITHUB_ENV"

      - name: QEMU BIOS candidate smoke test
        run: |
          KERNAID_SMOKE_LOG=rescue-repair-candidate-bios.log \
            ./tools/build-rescue/qemu-smoke.sh bios \
            "$PWD/KernAid-Rescue-amd64-repair-candidate.iso"

      - name: QEMU UEFI Secure Boot candidate smoke test
        run: |
          KERNAID_SMOKE_LOG=rescue-repair-candidate-uefi.log \
            ./tools/build-rescue/qemu-smoke.sh secureboot \
            "$PWD/KernAid-Rescue-amd64-repair-candidate.iso"

      - name: QEMU consolidated repair candidate qualification
        timeout-minutes: 135
        run: |
          log="$PWD/rescue-repair-candidate-batch.log"
          : >"$log"
          chmod 0600 "$log"
          KERNAID_QEMU_SMP=2 \
            ./tools/build-rescue/qemu-repair-candidate-smoke.sh \
            uefi qualification-batch \
            "$PWD/KernAid-Rescue-amd64-repair-candidate.iso" | tee "$log"
          grep -Eq \
            '^KERNAID_QEMU_REPAIR_QUALIFICATION_BATCH_ATTESTATION_V1 .* ready=true$' \
            "$log"

      - name: Upload sanitized repair candidate smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: KernAid-Rescue-repair-candidate-smoke-logs
          path: rescue-repair-candidate-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload private repair candidate forensics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: repair-candidate-forensics
          path: |
            KernAid-Rescue-amd64-repair-candidate.iso
            KernAid-Rescue-amd64-repair-candidate.iso.sha256
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload repair candidate ISO
        uses: actions/upload-artifact@v4
        with:
          name: KernAid-Rescue-amd64-repair-candidate
          path: |
            KernAid-Rescue-amd64-repair-candidate.iso
            KernAid-Rescue-amd64-repair-candidate.iso.sha256
          if-no-files-found: error
          retention-days: 7

  qualified-repair-release:
    if: github.ref == 'refs/heads/main'
    needs: build-and-smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0 }
      - name: Download the exact same-run Repair candidate
        uses: actions/download-artifact@v4
        with:
          name: KernAid-Rescue-amd64-repair-candidate
          path: ${{ runner.temp }}/kernaid-repair-qualified-input/image
      - name: Download the exact same-run Repair evidence
        uses: actions/download-artifact@v4
        with:
          name: KernAid-Rescue-repair-candidate-smoke-logs
          path: ${{ runner.temp }}/kernaid-repair-qualified-input/evidence
      - name: Assemble and verify the isolated Repair qualification
        env:
          KERNAID_ARTIFACT_VERSION: repair-ci-${{ github.run_id }}-${{ github.run_attempt }}
          KERNAID_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          input="$RUNNER_TEMP/kernaid-repair-qualified-input"
          qualified="$RUNNER_TEMP/kernaid-rescue-repair-qualified"
          install -d -m 0755 -- "$qualified"
          install -m 0644 -- \
            "$input/image/KernAid-Rescue-amd64-repair-candidate.iso" \
            "$qualified/KernAid-Rescue-Repair-amd64.iso"
          (cd "$qualified" && sha256sum KernAid-Rescue-Repair-amd64.iso \
            >KernAid-Rescue-Repair-amd64.iso.sha256)

          retail_raw="$RUNNER_TEMP/KernAid-Rescue-Repair-amd64-retail.img"
          truncate -s 32000000000 -- "$retail_raw"
          dd if="$qualified/KernAid-Rescue-Repair-amd64.iso" of="$retail_raw" \
            bs=4M conv=notrunc,sparse status=none
          env -u XZ_OPT -u XZ_DEFAULTS xz --format=xz --threads=1 \
            --check=sha256 --lzma2=preset=6 --stdout -- "$retail_raw" \
            >"$qualified/KernAid-Rescue-Repair-amd64-retail.img.xz"
          rm -f -- "$retail_raw"
          python3 -I -B tools/build-rescue/verify-retail-image.py \
            --variant repair \
            --iso "$qualified/KernAid-Rescue-Repair-amd64.iso" \
            --archive "$qualified/KernAid-Rescue-Repair-amd64-retail.img.xz" \
            --output "$qualified/KernAid-Rescue-Repair-amd64-retail.json"
          (cd "$qualified" && sha256sum \
            KernAid-Rescue-Repair-amd64-retail.img.xz \
            >KernAid-Rescue-Repair-amd64-retail.img.xz.sha256)

          grep -E '^KERNAID_QEMU_ATTESTATION_V1 firmware=bios ' \
            "$input/evidence/rescue-repair-candidate-bios.log" \
            >"$qualified/kernaid-rescue-repair-bios.sanitized.log"
          grep -E \
            '^KERNAID_QEMU_(ATTESTATION_V1 firmware=uefi|SECURE_BOOT_ATTESTATION_V1 firmware=uefi) ' \
            "$input/evidence/rescue-repair-candidate-uefi.log" \
            >"$qualified/kernaid-rescue-repair-uefi.sanitized.log"
          grep -E \
            '^KERNAID_QEMU_REPAIR_QUALIFICATION_BATCH_ATTESTATION_V1 ' \
            "$input/evidence/rescue-repair-candidate-batch.log" \
            >"$qualified/kernaid-rescue-repair-qualification-batch.sanitized.log"

          manifest_args=(
            --repository "$GITHUB_REPOSITORY"
            --commit "$GITHUB_SHA"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --run-url "$KERNAID_RUN_URL"
            --artifact-version "$KERNAID_ARTIFACT_VERSION"
            --iso "$qualified/KernAid-Rescue-Repair-amd64.iso"
            --checksum "$qualified/KernAid-Rescue-Repair-amd64.iso.sha256"
            --retail-image "$qualified/KernAid-Rescue-Repair-amd64-retail.img.xz"
            --retail-checksum "$qualified/KernAid-Rescue-Repair-amd64-retail.img.xz.sha256"
            --retail-metadata "$qualified/KernAid-Rescue-Repair-amd64-retail.json"
            --bios-evidence "$qualified/kernaid-rescue-repair-bios.sanitized.log"
            --uefi-evidence "$qualified/kernaid-rescue-repair-uefi.sanitized.log"
            --batch-evidence "$qualified/kernaid-rescue-repair-qualification-batch.sanitized.log"
            --catalog "$qualified/KernAid-Rescue-Repair-amd64.catalog-entry.json"
          )
          python3 -I -B tools/build-rescue/repair-qualification.py create \
            "${manifest_args[@]}" \
            --output "$qualified/KernAid-Rescue-Repair-amd64.qualified.json"
          python3 -I -B tools/build-rescue/repair-qualification.py verify \
            "${manifest_args[@]}" \
            --manifest "$qualified/KernAid-Rescue-Repair-amd64.qualified.json"
      - name: Attest the Repair ISO build provenance
        id: attest_repair_provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/kernaid-rescue-repair-qualified/KernAid-Rescue-Repair-amd64.iso
      - name: Attest the Repair ISO qualification
        id: attest_repair_qualification
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/kernaid-rescue-repair-qualified/KernAid-Rescue-Repair-amd64.iso
          predicate-type: https://kernaid.dev/attestations/rescue-repair-qualified-release/v1
          predicate-path: ${{ runner.temp }}/kernaid-rescue-repair-qualified/KernAid-Rescue-Repair-amd64.qualified.json
      - name: Attest the Repair retail image qualification
        id: attest_repair_retail
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/kernaid-rescue-repair-qualified/KernAid-Rescue-Repair-amd64-retail.img.xz
          predicate-type: https://kernaid.dev/attestations/rescue-repair-qualified-release/v1
          predicate-path: ${{ runner.temp }}/kernaid-rescue-repair-qualified/KernAid-Rescue-Repair-amd64.qualified.json
      - name: Include the Repair Sigstore bundles
        run: |
          qualified="$RUNNER_TEMP/kernaid-rescue-repair-qualified"
          install -m 0644 -- \
            "${{ steps.attest_repair_provenance.outputs.bundle-path }}" \
            "$qualified/KernAid-Rescue-Repair-amd64.provenance.sigstore.json"
          install -m 0644 -- \
            "${{ steps.attest_repair_qualification.outputs.bundle-path }}" \
            "$qualified/KernAid-Rescue-Repair-amd64.qualification.sigstore.json"
          install -m 0644 -- \
            "${{ steps.attest_repair_retail.outputs.bundle-path }}" \
            "$qualified/KernAid-Rescue-Repair-amd64-retail.qualification.sigstore.json"
      - name: Publish the qualified Repair bundle
        uses: actions/upload-artifact@v4
        with:
          name: KernAid-Rescue-Repair-amd64-qualified
          path: |
            ${{ runner.temp }}/kernaid-rescue-repair-qualified
            !${{ runner.temp }}/kernaid-rescue-repair-qualified/KernAid-Rescue-Repair-amd64-retail.img.xz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish the qualified Repair retail image separately
        uses: actions/upload-artifact@v4
        with:
          name: KernAid-Rescue-Repair-amd64-qualified-retail
          path: ${{ runner.temp }}/kernaid-rescue-repair-qualified/KernAid-Rescue-Repair-amd64-retail.img.xz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
