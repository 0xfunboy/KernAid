name: desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desk/**"
      - "crates/**"
      - "packs/**"
      - "packages/**"
      - "services/**"
      - "tests/fixtures/linux-hardware-inventory/**"
      - "tests/fixtures/linux-normalized-snapshot/**"
      - "tests/integration/linux-snapshot-resident-ipc.sh"
      - "tests/integration/run-linux-snapshot-resident-ipc-ci.sh"
      - "tools/test-linux-snapshot/**"
      - "tools/check-node-version.sh"
      - ".node-version"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"
      - "justfile"
      - ".github/workflows/desktop.yml"
permissions: { contents: read }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            name: linux-x86_64
            args: ""
            targets: ""
            companion: target/release/kernaid-provider-key
            companion_upload: kernaid-provider-key-linux-x86_64.tar.gz
          - platform: windows-latest
            name: windows-x86_64
            args: ""
            targets: ""
            companion: target/release/kernaid-provider-key.exe
            companion_upload: target/release/kernaid-provider-key.exe
          - platform: macos-latest
            name: macos-aarch64
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin
            companion: target/aarch64-apple-darwin/release/kernaid-provider-key
            companion_upload: kernaid-provider-key-macos-aarch64.tar.gz
          - platform: macos-latest
            name: macos-x86_64
            args: --target x86_64-apple-darwin
            targets: x86_64-apple-darwin
            companion: target/x86_64-apple-darwin/release/kernaid-provider-key
            companion_upload: kernaid-provider-key-macos-x86_64.tar.gz
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.targets }}
      - name: Install Linux prerequisites
        if: matrix.platform == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf procps util-linux
      - run: pnpm install --frozen-lockfile
      - name: Generate platform icons
        run: pnpm --filter @kernaid/desk tauri icon icon.svg
      - name: Exercise the production Resident snapshot command through Tauri IPC
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: ./tests/integration/run-linux-snapshot-resident-ipc-ci.sh
      - name: Test Resident OpenAI and credential companion boundaries
        if: matrix.name != 'macos-x86_64'
        shell: bash
        run: |
          cargo test --locked -p kernaid-desk-shell resident_openai -- --nocapture
          cargo test --locked -p kernaid-desk-shell --bin kernaid-provider-key -- --nocapture
      - name: Probe native macOS P0 sources
        if: matrix.name == 'macos-aarch64'
        run: |
          pnpm --filter @kernaid/desk build
          cargo test --locked -p kernaid-desk-shell resident_macos_native_runtime_probe -- --nocapture
      - name: Build native provider credential companion
        run: cargo build --locked --release -p kernaid-desk-shell --bin kernaid-provider-key ${{ matrix.args }}
      - name: Package executable native provider credential companion
        if: runner.os != 'Windows'
        shell: bash
        env:
          COMPANION_SOURCE: ${{ matrix.companion }}
          COMPANION_ARCHIVE: ${{ matrix.companion_upload }}
        run: |
          python3 - <<'PY'
          import gzip
          import hashlib
          import io
          import os
          import tarfile

          source = os.environ["COMPANION_SOURCE"]
          archive = os.environ["COMPANION_ARCHIVE"]
          with open(source, "rb") as executable:
              payload = executable.read()

          info = tarfile.TarInfo("kernaid-provider-key")
          info.size = len(payload)
          info.mode = 0o700
          info.mtime = 0
          info.uid = 0
          info.gid = 0
          info.uname = "root"
          info.gname = "root"
          with open(archive, "wb") as destination:
              with gzip.GzipFile(
                  filename="", fileobj=destination, mode="wb", mtime=0
              ) as compressed:
                  with tarfile.open(
                      fileobj=compressed, mode="w", format=tarfile.USTAR_FORMAT
                  ) as bundle:
                      bundle.addfile(info, fileobj=io.BytesIO(payload))

          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              assert len(members) == 1
              member = members[0]
              assert member.name == "kernaid-provider-key"
              assert member.isfile()
              assert member.mode == 0o700
              extracted = bundle.extractfile(member)
              assert extracted is not None
              assert hashlib.sha256(extracted.read()).digest() == hashlib.sha256(payload).digest()
          PY
      - name: Upload native provider credential companion
        uses: actions/upload-artifact@v4
        with:
          name: kernaid-provider-key-${{ matrix.name }}
          path: ${{ matrix.companion_upload }}
          if-no-files-found: error
      - name: Preseed pinned Tauri AppImage tooling
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        env:
          KERNAID_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tools_dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools_dir"
          if [[ -L "$tools_dir" || ! -d "$tools_dir" || ! -O "$tools_dir" ]]; then
            echo "Tauri tools cache must be an owned, real directory" >&2
            exit 1
          fi
          chmod 0700 "$tools_dir"
          if [[ "$(stat -c '%u:%a' "$tools_dir")" != "$(id -u):700" ]]; then
            echo "Tauri tools cache owner or mode is unsafe" >&2
            exit 1
          fi
          temporary_files=()
          cleanup() {
            local temporary
            for temporary in "${temporary_files[@]}"; do
              if [[ -e "$temporary" ]]; then
                rm -f -- "$temporary"
              fi
            done
          }
          trap cleanup EXIT

          fetch_pinned_tool() {
            local name="$1"
            local url="$2"
            local expected_sha256="$3"
            local expected_size="$4"
            local accept="$5"
            local destination="$tools_dir/$name"
            local temporary
            if [[ -e "$destination" || -L "$destination" ]]; then
              if [[ ! -f "$destination" || -L "$destination" ]]; then
                echo "Refusing unsafe Tauri tool destination: $name" >&2
                return 1
              fi
            fi
            temporary="$(mktemp "$tools_dir/.${name}.XXXXXX")"
            temporary_files+=("$temporary")

            curl --proto '=https' --tlsv1.2 \
              --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 60 --max-filesize "$expected_size" \
              --retry 5 --retry-all-errors --retry-max-time 180 \
              --header "Authorization: Bearer ${KERNAID_GITHUB_TOKEN}" \
              --header "Accept: ${accept}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$temporary" "$url"
            if [[ "$(stat -c '%s' "$temporary")" != "$expected_size" ]]; then
              echo "Unexpected byte size for pinned Tauri tool: $name" >&2
              return 1
            fi
            printf '%s  %s\n' "$expected_sha256" "$temporary" \
              | sha256sum --check --strict -
            chmod 0755 "$temporary"
            if [[ ! -O "$temporary" || "$(stat -c '%a' "$temporary")" != 755 ]]; then
              echo "Unexpected owner or mode for pinned Tauri tool: $name" >&2
              return 1
            fi
            mv -fT -- "$temporary" "$destination"
          }

          fetch_pinned_tool \
            AppRun-x86_64 \
            https://api.github.com/repos/tauri-apps/binary-releases/releases/assets/274691722 \
            f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f \
            31552 \
            application/octet-stream
          fetch_pinned_tool \
            linuxdeploy-x86_64.AppImage \
            https://api.github.com/repos/tauri-apps/binary-releases/releases/assets/182515537 \
            e762bea85c8eb0d4b3508d46e5c1f037f717d0f9303ae3b4aafc8b04991fa1ef \
            13264064 \
            application/octet-stream
          fetch_pinned_tool \
            linuxdeploy-plugin-gtk.sh \
            'https://api.github.com/repos/tauri-apps/linuxdeploy-plugin-gtk/contents/linuxdeploy-plugin-gtk.sh?ref=b5eb8d05b4c0ed40107fe2158c5d8527f94568ef' \
            cb379f9b0733e9ad9f8bd78f8c2fa038aef2478523bb7d4c8e64ff6a1ea3501a \
            11648 \
            application/vnd.github.raw+json
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.name, 'macos-') && '-' || '' }}
        with:
          projectPath: apps/desk
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: kernaid-desk-[platform]-[arch]-[bundle]
